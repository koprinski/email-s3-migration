name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emails_test
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laravel -d emails_test"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: emails_test
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: emails
      AWS_ENDPOINT: http://127.0.0.1:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      RUN_MINIO_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, intl, gd, zip, bcmath, pcntl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Pint)
        run: composer lint

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create the S3 bucket in MinIO
        run: |
          for i in $(seq 1 30); do
            aws --endpoint-url http://127.0.0.1:9000 s3 ls >/dev/null 2>&1 && break
            sleep 1
          done
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://emails

      - name: Run test suite (unit + feature + MinIO integration)
        run: php artisan test
